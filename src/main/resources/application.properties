spring.application.name=assignment-tracker
server.port=${PORT:8080}

# Database (local defaults, deployment me environment variables se override honge)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/assignment_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:change_me}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Fixed admin login
app.admin.email=${ADMIN_EMAIL:admin@tracker.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}