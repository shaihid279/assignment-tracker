<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Assignment Progress')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<main class="app-main">
    <header th:replace="~{fragments/layout :: topbar('Assignment Progress')}"></header>

    <div class="app-content">
        <a th:href="@{/teacher/dashboard}" class="small fw-semibold"><i class="bi bi-arrow-left"></i> Back to dashboard</a>

        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 my-3">
            <div>
                <h1 class="page-title" th:text="${assignment.title}">Assignment</h1>
                <p class="page-subtitle">
                    <span th:text="${assignment.subject}">Subject</span> &middot; Due
                    <span th:text="${#temporals.format(assignment.dueDate, 'dd MMM yyyy')}">01 Jan 2026</span>
                </p>
            </div>
            <a class="btn btn-outline-primary" th:href="@{/teacher/assignments/{id}/edit(id=${assignment.id})}"><i class="bi bi-pencil me-1"></i> Edit assignment</a>
        </div>

        <div class="panel mb-4" th:if="${!#strings.isEmpty(assignment.description)}">
            <div class="panel-body">
                <div class="small fw-bold text-muted mb-1">Instructions</div>
                <div style="white-space: pre-line;" th:text="${assignment.description}">Description</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header"><h3>Student progress</h3></div>
            <div class="table-responsive" th:if="${!roster.isEmpty()}">
                <table class="table">
                    <thead>
                    <tr><th>Student</th><th>Roll number</th><th>ID card number</th><th>Status</th><th style="min-width: 190px;">Progress</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${roster}">
                        <td><a class="cell-title" th:href="@{/teacher/students/{id}(id=${r.student.id})}" th:text="${r.student.fullName}">Name</a></td>
                        <td th:text="${r.student.rollNumber}">Roll</td>
                        <td th:text="${r.student.idCardNumber}">ID</td>
                        <td><span th:replace="~{fragments/layout :: statusBadge(${r.status})}"></span></td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="flex-grow-1"><div th:replace="~{fragments/layout :: progressBar(${r.percent})}"></div></div>
                                <span class="percent-label" th:text="${r.percent} + '%'">0%</span>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="empty-state" th:if="${roster.isEmpty()}">
                <i class="bi bi-people"></i>
                <h4>No students registered yet</h4>
                <p class="mb-0">Progress appears here as students register and update their work.</p>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
