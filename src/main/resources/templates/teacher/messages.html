<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student Messages')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('messages')}"></aside>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<main class="app-main">
    <header th:replace="~{fragments/layout :: topbar('Student Messages')}"></header>

    <div class="app-content">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="mb-4">
            <h1 class="page-title">Student messages</h1>
            <p class="page-subtitle">Questions sent to you by students, with your replies.</p>
        </div>

        <div class="empty-state panel" th:if="${messages.isEmpty()}">
            <i class="bi bi-inbox"></i>
            <h4>No messages yet</h4>
            <p class="mb-0">When a student contacts you, the message appears here.</p>
        </div>

        <div class="d-flex flex-column gap-3" style="max-width: 860px;">
            <div class="message-card" th:each="m : ${messages}">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div>
                        <div class="cell-title" th:text="${m.subject}">Subject</div>
                        <div class="small text-muted">
                            From <a th:href="@{/teacher/students/{id}(id=${m.student.id})}" th:text="${m.student.fullName}">Student</a>
                            (<span th:text="${m.student.rollNumber}">Roll</span>) &middot;
                            <span th:text="${#temporals.format(m.createdAt, 'dd MMM yyyy, HH:mm')}">Date</span>
                        </div>
                    </div>
                    <span class="status-badge status-completed" th:if="${m.reply != null}">Replied</span>
                    <span class="status-badge status-pending" th:if="${m.reply == null}">Needs reply</span>
                </div>
                <p class="mt-2 mb-0" style="white-space: pre-line;" th:text="${m.body}">Message</p>

                <div class="reply-box" th:if="${m.reply != null}">
                    <div class="small fw-bold mb-1">Your reply</div>
                    <div style="white-space: pre-line;" th:text="${m.reply}">Reply</div>
                </div>

                <form class="mt-3" th:if="${m.reply == null}" th:action="@{/teacher/messages/{id}/reply(id=${m.id})}" method="post">
                    <label class="form-label" th:for="'reply-' + ${m.id}">Reply</label>
                    <textarea class="form-control mb-2" th:id="'reply-' + ${m.id}" name="reply" rows="3" maxlength="2000" required></textarea>
                    <button type="submit" class="btn btn-primary btn-sm px-3">Send reply</button>
                </form>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
